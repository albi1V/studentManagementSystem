<label class="password-field" [for]="inputId">
  <span class="field-label">{{ label }}</span>
  <span class="password-input">
    <input [id]="inputId" [type]="visible ? 'text' : 'password'" [value]="value" [placeholder]="placeholder" [autocomplete]="autocomplete" [attr.aria-describedby]="describedBy" [attr.aria-invalid]="invalid" [disabled]="disabled" (input)="updateValue($any($event.target).value)" (blur)="onTouched()" />
    <button type="button" (click)="toggleVisibility()" [disabled]="disabled" [attr.aria-label]="visible ? 'Hide password' : 'Show password'" [attr.aria-pressed]="visible">{{ visible ? 'Hide' : 'Show' }}</button>
  </span>
</label>
